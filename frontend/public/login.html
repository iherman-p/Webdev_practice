<!DOCTYPE html>

<html>

	<head>  

		<title>
			Really cool website
		</title>

		<link rel="stylesheet" type="text/css" href="./style.css">
	</head>

	<body>
		<div class="centered-text">
			<h2>
				<a href="/">Cool fucking website </a>
			</h2>
		</div>
		<hr>

		<br>
		<div class="centered-text">
			<form id="loginForm">
				<div style="margin-bottom: 5%;">
					<label for="login">Log into your account!</label>
				</div>

				<div style="margin-bottom: 5%;">
					<input required
					type="string"
					id="username"
					name="username"
					placeholder="Username (example: John1234567891011121314151617181920)"
					>
				</div>

				<div style="margin-bottom: 5%;">
					<input required
					type="string"
					id="password"
					name="password"
					placeholder="Password"
					>
				</div>

				<div style="margin-bottom: 5%;">
					<button type="submit"> log in </button>
				</div>

				<a href="/signup">Dont have an account?</a>
			</form>



		</div>

		<script src="/scripts/login.js">

		</script>

	</body>

</html>
